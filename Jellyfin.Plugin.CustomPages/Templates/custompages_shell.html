<!-- Content fragment injected into the base JPKribs.Jellyfin.Base status card. -->
<div id="signin" class="hidden">
    <h1>Sign in required</h1>
    <p>Sign in to your account to view this page.</p>
    <a id="signinLink" class="jpk-btn" href="/web/">Sign in</a>
</div>

<div id="denied" class="hidden">
    <h1>Not authorized</h1>
    <p>Your account doesn't have access to this page.</p>
    <a id="homeLink" class="jpk-btn" href="/web/">Back to Jellyfin</a>
</div>

<div id="missing" class="hidden">
    <h1>Page not found</h1>
    <p>This page is no longer available.</p>
    <a id="missingLink" class="jpk-btn" href="/web/">Back to Jellyfin</a>
</div>

<script>
    (function () {
        var slug = '{{SLUG}}';
        var tier = '{{TIER}}';

        var prefix = location.pathname.split('/pages/')[0];
        var contentUrl = prefix + '/pages/' + encodeURIComponent(slug) + '/' + tier;
        var webHref = prefix + '/web/';

        ['signinLink', 'homeLink', 'missingLink'].forEach(function (id) {
            var a = document.getElementById(id);
            if (a) a.href = webHref;
        });

        // Hide the base card's loading heading + spinner before revealing a state.
        function leaveLoading() {
            var h = document.querySelector('.jpk-status-card > h1');
            var s = document.querySelector('.jpk-status-card > .jpk-spinner');
            if (h) h.style.display = 'none';
            if (s) s.style.display = 'none';
        }

        function show(id) {
            leaveLoading();
            ['signin', 'denied', 'missing'].forEach(function (k) {
                document.getElementById(k).classList.toggle('hidden', k !== id);
            });
        }

        function getToken() {
            try {
                var raw = localStorage.getItem('jellyfin_credentials');
                if (!raw) return null;
                var creds = JSON.parse(raw);
                var servers = (creds && creds.Servers) || [];
                for (var i = 0; i < servers.length; i++) {
                    if (servers[i] && servers[i].AccessToken) return servers[i].AccessToken;
                }
            } catch (e) { /* fall through to no-token */ }
            return null;
        }

        var token = getToken();
        if (!token) { show('signin'); return; }

        fetch(contentUrl, {
            headers: {
                'Authorization': 'MediaBrowser Token="' + token + '"',
                'Accept': 'text/html'
            }
        })
            .then(function (r) {
                if (r.status === 401) { show('signin'); return null; }
                if (r.status === 403) { show('denied'); return null; }
                if (r.status === 404) { show('missing'); return null; }
                return r.text();
            })
            .then(function (html) {
                if (html === null || html === undefined) return;
                document.open();
                document.write(html);
                document.close();
            })
            .catch(function () { show('signin'); });
    })();
</script>
