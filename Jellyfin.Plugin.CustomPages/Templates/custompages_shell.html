<!-- Content fragment injected into the base JPKribs.Jellyfin.Base status card. -->
<div id="signin" class="hidden">
    <h1>Sign in required</h1>
    <p>Sign in to your account to view this page.</p>
    <a id="signinLink" class="jpk-btn" href="/web/">Sign in</a>
</div>

<div id="denied" class="hidden">
    <h1>Not authorized</h1>
    <p>Your account doesn't have access to this page.</p>
    <a id="homeLink" class="jpk-btn" href="/web/">Back to Jellyfin</a>
</div>

<div id="missing" class="hidden">
    <h1>Page not found</h1>
    <p>This page is no longer available.</p>
    <a id="missingLink" class="jpk-btn" href="/web/">Back to Jellyfin</a>
</div>

<script>
    (function () {
        var slug = '{{SLUG}}';
        var tier = '{{TIER}}';

        var prefix = location.pathname.split('/pages/')[0];
        var contentUrl = prefix + '/pages/' + encodeURIComponent(slug) + '/' + tier;
        var webHref = prefix + '/web/';

        ['signinLink', 'homeLink', 'missingLink'].forEach(function (id) {
            var a = document.getElementById(id);
            if (a) a.href = webHref;
        });

        // Hide the base card's loading heading + spinner before revealing a state.
        function leaveLoading() {
            var h = document.querySelector('.jpk-status-card > h1');
            var s = document.querySelector('.jpk-status-card > .jpk-spinner');
            if (h) h.style.display = 'none';
            if (s) s.style.display = 'none';
        }

        function show(id) {
            leaveLoading();
            ['signin', 'denied', 'missing'].forEach(function (k) {
                document.getElementById(k).classList.toggle('hidden', k !== id);
            });
        }

        // localStorage['jellyfin_credentials'] is an internal of the web client, not a public API. If its
        // shape ever changes this returns nothing and every protected page degrades to the sign-in
        // prompt rather than breaking, which is the only safe direction to fail.
        function readServers() {
            try {
                var raw = localStorage.getItem('jellyfin_credentials');
                if (!raw) return [];
                return (JSON.parse(raw) || {}).Servers || [];
            } catch (e) { return []; }
        }

        function originOf(address) {
            try { return new URL(String(address)).origin.toLowerCase(); } catch (e) { return ''; }
        }

        function normalizeId(id) {
            return String(id || '').replace(/-/g, '').toLowerCase();
        }

        // A client signed in to several servers stores one entry each. Only this server's own entry is
        // ever sent here: another server's token would hand this server a credential for somewhere else.
        // The entry is matched by server ID, which survives a reverse proxy serving this origin under a
        // hostname the client never stored, or by an address on exactly this origin.
        function getTokens(serverId) {
            var here = location.origin.toLowerCase();
            var wanted = normalizeId(serverId);
            var tokens = [];
            var servers = readServers();
            for (var i = 0; i < servers.length; i++) {
                var server = servers[i];
                if (!server || !server.AccessToken) continue;

                var matches = wanted && normalizeId(server.Id) === wanted;
                if (!matches) {
                    var addresses = [server.ManualAddress, server.LocalAddress, server.RemoteAddress];
                    for (var j = 0; j < addresses.length; j++) {
                        if (addresses[j] && originOf(addresses[j]) === here) {
                            matches = true;
                            break;
                        }
                    }
                }

                if (matches && tokens.indexOf(server.AccessToken) < 0) tokens.push(server.AccessToken);
            }

            return tokens;
        }

        // This server's tokens, filled once the public info lookup answers. Declared here so it stays
        // inside this closure: the protected page is written into this same document, and must never be
        // able to read the viewer's tokens off the window.
        var tokens = [];

        function attempt(index) {
            if (index >= tokens.length) { show('signin'); return; }

            fetch(contentUrl, {
                headers: {
                    'Authorization': 'MediaBrowser Token="' + tokens[index] + '"',
                    'Accept': 'text/html'
                }
            })
                .then(function (r) {
                    // 401 means this token is no longer valid here, such as a stale entry left by an
                    // earlier sign in. Try the next of this server's entries before giving up.
                    if (r.status === 401) { attempt(index + 1); return null; }
                    if (r.status === 403) { show('denied'); return null; }
                    if (r.status === 404) { show('missing'); return null; }
                    return r.text();
                })
                .then(function (html) {
                    if (html === null || html === undefined) return;
                    document.open();
                    document.write(html);
                    document.close();
                })
                .catch(function () { show('signin'); });
        }

        // The public info endpoint needs no token and names this server, so credentials are chosen by
        // which server issued them rather than by guessing from addresses.
        fetch(prefix + '/System/Info/Public', { headers: { 'Accept': 'application/json' } })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; })
            .then(function (info) {
                tokens = getTokens(info && info.Id);
                if (!tokens.length) { show('signin'); return; }
                attempt(0);
            });
    })();
</script>
