<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="favicon.ico" />
<title>{{TITLE}}</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#f2f2f2;background:radial-gradient(1200px 600px at 50% -10%,rgba(0,164,220,0.12),transparent 60%),#101010;font-family:'Noto Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.cp-card{width:100%;max-width:420px;text-align:center;background:#1c1c1f;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:40px 32px;box-shadow:0 24px 60px rgba(0,0,0,0.45)}
.cp-logo{width:72px;height:72px;margin:0 auto 20px;display:block;border-radius:16px}
h1{font-size:1.4rem;font-weight:600;margin:0 0 8px}
p{margin:0;color:rgba(255,255,255,0.55);font-size:0.95rem;line-height:1.5}
.cp-btn{display:inline-block;margin-top:22px;padding:0.7em 1.6em;border-radius:8px;background:#00a4dc;color:#fff;font-size:0.95rem;font-weight:600;text-decoration:none}
.cp-btn:hover{background:#0095c8}
</style>
</head>
<body>
<div class="cp-card">
<img class="cp-logo" src="../web/favicons/touchicon.png" alt="" />
<h1>{{HEADING}}</h1>
<p>{{MESSAGE}}</p>
<a class="cp-btn" href="../web/">Back to Jellyfin</a>
</div>
</body>
</html>
