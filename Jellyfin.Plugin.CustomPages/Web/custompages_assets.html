<div id="CustomPagesAssetsPage" data-role="page"
     class="page type-interior pluginConfigurationPage withTabs"
     data-controller="__plugin/custompages_assets.js">
    <div data-role="content">
        <div class="content-primary">
            <form id="CustomPagesAssetsForm">
                <div class="verticalSection verticalSection-extrabottompadding">

                    <!-- Page title -->
                    <div class="sectionTitleContainer flex align-items-center">
                        <h1 class="sectionTitle">Assets</h1>
                    </div>

                    <div class="fieldDescription">
                        Hosts images for your pages. Reference one by the path on its row, such as <code>asset/logo.png</code>.
                    </div>
                    <div class="base-info">
                        Images set to Anyone are public at <code>/pages/asset/{name}</code>. Images set to User or Admin are only embedded into pages of the same or a higher visibility.
                    </div>

                    <!-- Asset counts -->
                    <div id="assetCounts" class="base-cards compact"></div>

                    <!-- Upload -->
                    <!-- Filled by createFilePicker. -->
                    <div id="assetPicker"></div>

                    <!-- Asset list -->
                    <div id="assetEmpty" class="base-empty-section hidden">No images yet. Add one above.</div>
                    <div id="assetList" class="base-asset-list"></div>
                    <span id="assetStatus" class="base-status-text" role="status"></span>

                </div>
            </form>
        </div>
    </div>

    <link rel="stylesheet" href="configurationpage?name=custompages_jpkribs_shared.css">
</div>
