site_name: Custom Pages
site_description: A Jellyfin plugin that publishes custom pages on your server at /pages/{slug}.
site_url: https://jpkribs.github.io/jellyfin-plugin-custompages/
repo_url: https://github.com/JPKribs/jellyfin-plugin-custompages
repo_name: JPKribs/jellyfin-plugin-custompages
edit_uri: edit/master/docs/
docs_dir: docs
exclude_docs: |
  .DS_Store

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Getting Started:
      - Installation: Installation.md
  - Pages:
      - Authoring: Authoring.md
      - Visibility: Visibility.md
      - Restricting Access: RestrictingAccess.md
      - System Access: SystemAccess.md
  - Features:
      - Storing Data: StoringData.md
      - Images and Assets: Assets.md
  - Reference:
      - Security: Security.md
      - Versioning: Versioning.md
